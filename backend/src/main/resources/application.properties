spring.application.name=farmacia
server.port=8080

# Configuración de Base de Datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3307/farmacia_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configuración de Jackson (fechas ISO)
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Lima

# Consulta de DNI (RENIEC) y RUC (SUNAT) vía apiperu.dev
apiperu.base-url=https://apiperu.dev/api
apiperu.token=${APIPERU_TOKEN:ddd11e7aa5cc56a6c8a1f60c0aee35085ca826ea61594ebcdd706c4f1572ea2a}
apiperu.connect-timeout=5s
apiperu.read-timeout=10s
